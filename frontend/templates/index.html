<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Simple Chat — CamHack</title>
    <link rel="stylesheet" href="/static/style.css" />
  </head>
  <body>
    <main class="chat-card">
      <header class="chat-header">
        <h1>Simple Chat</h1>
        <p class="muted">A small demo chat backed by Python/Flask</p>
      </header>

      <section id="messages" class="messages" aria-live="polite"></section>

      <form id="composer" class="composer" autocomplete="off">
        <input id="input" name="message" placeholder="Type a message..." />
        <button id="send" type="submit">Send</button>
      </form>
    </main>

    <script src="/static/main.js"></script>
    <audio autoplay muted loop hidden>
      <source
        src="{{ url_for('static', filename='drillclash.mp3') }}"
        type="audio/mpeg"
      />
    </audio>

    <script>
      // unmute & play once user interacts
      document.addEventListener(
        "click",
        () => {
          const audio = document.querySelector("audio");
          audio.muted = false;
          audio.play();
        },
        { once: true }
      );
    </script>
  </body>
</html>
